<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if title %}
        <title>Task Manager - {{ title }}</title>
    {% else %}
        <title>Task Manager</title>
    {% endif %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="navbar navbar-expand-sm bg-dark p-2">
        {% block navbar %}
        {% endblock navbar %}
    </div>

    <div class="content row p-5">
        {% block content %}
        {% endblock content %}
    </div>

    {% block modal %}
    {% endblock modal %}

    <div class="navbar navbar-expand-sm bg-dark fixed-bottom">
        <div class="container-fluid">
            <span class="navbar-text">
                Made by AlvaroCrespo02. Original repo <a href="https://github.com/AlvaroCrespo02/Task_Manager_API">here</a>.
            </span>
        </div>
    </div>
</body>
</html>
