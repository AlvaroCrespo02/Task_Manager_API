<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if title %}
        <title>Task Manager - {{ title }}</title>
    {% else %}
        <title>Task Manager</title>
    {% endif %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div class="navbar navbar-expand-sm bg-dark p-2">
        <div class="container-fluid">
            <a class="navbar-brand">TaskManager</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#signUp">Sign up</button>
                </li>
                <li class="nav-item">
                    <button type="button" class="btn btn-primary ms-2">Register</button>
                </li>
            </ul>
        </div>
    </div>

    <div class="content row p-5">
        {% block content %}
        {% endblock content %}
    </div>

    <!-- Registration Modal -->
    <div class="modal fade" id="signUp">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Modal Header -->
                <!-- <div class="modal-header">
                    <h4 class="modal-title">Modal Heading</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div> -->

                <!-- Modal body -->
                <div class="modal-body">
                    <form action="#">
                        <div class="mb-3 mt-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
                        </div>
                        <div class="mb-3">
                            <label for="pwd" class="form-label">Password:</label>
                            <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
                        </div>
                        <div class="form-check mb-3">
                            <label class="form-check-label">
                            <input class="form-check-input" type="checkbox" name="remember"> Remember me
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary">Register</button>
                    </form>
                </div>


            </div>
        </div>
    </div>

    <div class="navbar navbar-expand-sm bg-dark fixed-bottom">
        <div class="container-fluid">
            <span class="navbar-text">
                Made by AlvaroCrespo02. Original repo <a href="https://github.com/AlvaroCrespo02/Task_Manager_API">here</a>.
            </span>
        </div>
    </div>
</body>
</html>
